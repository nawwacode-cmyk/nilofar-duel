name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'HANDOFF.md', 'public/index.html', 'public/assets/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install
        run: npm ci

      - name: Web bundle
        run: npm run build && npm run build:www

      - name: Android project
        run: npx cap add android

      - name: Icon and splash
        run: npx @capacitor/assets generate --android --assetPath resources --iconBackgroundColor '#05080f' --iconBackgroundColorDark '#05080f' --splashBackgroundColor '#05080f' --splashBackgroundColorDark '#05080f'
        continue-on-error: true

      - name: Landscape
        run: sed -i '0,/<activity/s//<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml

      - name: Sync
        run: npx cap sync android

      # Same signing key on every build, so a new APK installs as an update over the old one
      # (a fresh random debug key per CI run made Android refuse updates). Debug keys are not secret.
      - name: Stable debug signing key
        run: mkdir -p ~/.android && cp android-config/debug.keystore ~/.android/debug.keystore

      # Increasing version code so Android treats every build as a newer version.
      - name: Version
        run: sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Check web bundle inside the APK
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/public/build/play-.*\.js'
          unzip -p android/app/build/outputs/apk/debug/app-debug.apk assets/public/index.html | grep -q 'src="./build/play-'

      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk nilofar-duel.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: أسرار الظلام 1.0.${{ github.run_number }}
          body: آخر نسخة من «أسرار الظلام» للأندرويد. نزّل nilofar-duel.apk وافتحه على موبايلك.
          files: nilofar-duel.apk
          make_latest: true
