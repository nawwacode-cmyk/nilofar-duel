name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'index.html', 'assets/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install
        run: npm install

      - name: Web bundle
        run: npm run build:www

      - name: Android project
        run: npx cap add android

      - name: Icon and splash
        run: npx @capacitor/assets generate --android --assetPath resources --iconBackgroundColor '#05080f' --iconBackgroundColorDark '#05080f' --splashBackgroundColor '#05080f' --splashBackgroundColorDark '#05080f'
        continue-on-error: true

      - name: Landscape
        run: sed -i '0,/<activity/s//<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk nilofar-duel.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: مبارزة النيلوفر 1.0.${{ github.run_number }}
          body: آخر نسخة من اللعبة للأندرويد. نزّل nilofar-duel.apk وافتحه على موبايلك.
          files: nilofar-duel.apk
          make_latest: true
