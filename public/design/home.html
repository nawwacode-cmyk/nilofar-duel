<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>أسرار الظلام — أربعة تصاميم لشاشة الاختيار</title>
<style>
@font-face{font-family:Alexandria;src:url(ar.woff2) format('woff2');font-weight:100 900;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:Alexandria;src:url(la.woff2) format('woff2');font-weight:100 900;unicode-range:U+0000-00FF}
@font-face{font-family:Icons;src:url(ic.woff2) format('woff2')}
:root{--gold:#e0b45a;--gold-hi:#fbe3a2;--gold-lo:#8d6428;--ink:#f3e8d0;--muted:#b2aac2;--night:#05070d;
  --gold-text:linear-gradient(180deg,#fff4cf 0%,#f3cd77 45%,#b9822f 100%)}
*{box-sizing:border-box}
html,body{margin:0;background:#020306;color:var(--ink);font-family:Alexandria,system-ui,sans-serif}
.ic{font-family:Icons;font-feature-settings:'liga';font-size:1.2em;line-height:1;vertical-align:-.2em}
/* page chrome */
.top{position:sticky;top:0;z-index:10;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px;background:#020306ee;border-bottom:1px solid #8d642855}
.top h1{margin:0 0 0 12px;font-size:15px;font-weight:700;color:var(--gold-hi)}
.tab{height:34px;padding:0 16px;border-radius:999px;border:none;cursor:pointer;font:600 13px Alexandria;color:var(--muted);background:#120e1a;box-shadow:inset 0 0 0 1px var(--gold-lo)}
.tab.on{color:#241503;background:linear-gradient(180deg,#fff0bf,#f0c46a 45%,#b7802f)}
.note{max-width:900px;margin:10px auto 0;padding:0 12px;text-align:center;color:var(--muted);font-size:13px;line-height:1.7}
.stage{width:100%;padding:12px;display:flex;justify-content:center}
.fit{width:1280px;height:640px;transform-origin:top center}
/* shared */
.screen{position:relative;width:1280px;height:640px;overflow:hidden;border-radius:10px;box-shadow:0 0 0 1px #000,0 0 0 2px var(--gold-lo),0 20px 60px #000;
  background:linear-gradient(180deg,#05070d88,#05070d00 30%,#05070dcc),radial-gradient(ellipse at 50% 40%,#05070d22,#05070dcc 80%),url(bg.webp) center/cover;display:none}
.screen.on{display:block}
.gtxt{background:var(--gold-text);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.5;padding-bottom:.1em}
.btn{--cut:14px;position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 34px;border:none;cursor:pointer;font:700 19px Alexandria;color:#241503;white-space:nowrap;
  background:linear-gradient(180deg,#fff0bf,#f0c46a 40%,#b7802f);clip-path:polygon(var(--cut) 0,calc(100% - var(--cut)) 0,100% 50%,calc(100% - var(--cut)) 100%,var(--cut) 100%,0 50%);filter:drop-shadow(0 0 10px #e0b45a66)}
.btn.ice{color:#eef8ff;background:linear-gradient(180deg,#6fb4ff,#2c5fae 60%,#1b3870)}
.btn.dark{color:var(--gold-hi);background:linear-gradient(180deg,#2a2236,#120e1a);filter:none}
.btn.sm{height:36px;font-size:14px;padding:0 22px;--cut:11px}
.chip{height:30px;padding:0 14px;border:none;border-radius:999px;cursor:pointer;font:600 12.5px Alexandria;color:var(--muted);background:#0b0912cc;box-shadow:inset 0 0 0 1px var(--gold-lo)}
.chip.on{color:#241503;background:linear-gradient(180deg,#f0c46a,#b7802f)}
.round{width:36px;height:36px;border-radius:50%;border:none;display:grid;place-items:center;color:var(--gold);background:#0b0912dd;box-shadow:inset 0 0 0 1px var(--gold-lo)}
.lbl{font-size:12px;color:var(--muted)}
.poster{object-fit:cover;border-radius:10px;display:block}
.arena{position:relative;width:150px;height:72px;border-radius:8px;overflow:hidden;cursor:pointer;box-shadow:0 0 0 1px #000,0 0 0 2px #8d642899;filter:saturate(.7) brightness(.75)}
.arena img{width:100%;height:100%;object-fit:cover}
.arena span{position:absolute;inset:auto 0 0;padding:3px 0;font-size:12px;font-weight:700;text-align:center;background:linear-gradient(0deg,#000c,#0000)}
.arena.on{box-shadow:0 0 0 1px #000,0 0 0 2px var(--gold-hi),0 0 14px #f0c46a77;filter:none}

/* ---------- 1. Hero stage ---------- */
#d1 .hero{position:absolute;right:40px;top:28px;bottom:28px;width:400px}
#d1 .hero img{width:100%;height:100%;box-shadow:0 0 0 1px #000,0 0 0 2px var(--gold),0 0 60px var(--c)}
#d1 .hero .cap{position:absolute;inset:auto 0 0;padding:70px 22px 18px;border-radius:0 0 10px 10px;background:linear-gradient(0deg,#05070df2 30%,#05070d00)}
#d1 .hero b{display:block;font-size:46px;font-weight:800}
#d1 .hero em{font-style:normal;color:var(--c);font-weight:600;font-size:15px}
#d1 .hero .btn{margin-top:10px}
#d1 .side{position:absolute;left:40px;right:480px;top:28px;bottom:28px;display:flex;flex-direction:column;gap:22px}
#d1 .head{display:flex;justify-content:space-between;align-items:center}
#d1 .head .t{font-size:28px;font-weight:800}
#d1 .meds{display:flex;gap:18px;justify-content:center}
#d1 .med{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;opacity:.7}
#d1 .med img{width:96px;height:96px;border-radius:50%;object-fit:cover;object-position:50% 18%;box-shadow:0 0 0 2px #000,0 0 0 4px var(--gold-lo)}
#d1 .med.on{opacity:1}#d1 .med.on img{box-shadow:0 0 0 2px #000,0 0 0 4px var(--gold-hi),0 0 20px var(--c)}
#d1 .med span{font-weight:700;font-size:14px}
#d1 .row{display:flex;align-items:center;gap:12px;justify-content:center}
#d1 .cta{margin-top:auto;display:flex;gap:16px;justify-content:center}

/* ---------- 2. Face off ---------- */
#d2 .p{position:absolute;top:30px;width:330px;height:470px}
#d2 .p img{width:100%;height:100%}
#d2 .p.me{right:30px}#d2 .p.me img{box-shadow:0 0 0 1px #000,0 0 0 2px var(--gold),0 0 50px var(--c)}
#d2 .p.op{left:30px}
#d2 .p.op .q{width:100%;height:100%;border-radius:10px;display:grid;place-items:center;font-size:150px;font-weight:800;color:#ffffff22;background:radial-gradient(circle,#1a1530,#07060c);box-shadow:0 0 0 1px #000,0 0 0 2px #8d642899}
#d2 .p .nm{position:absolute;inset:auto 0 -46px;text-align:center;font-size:30px;font-weight:800}
#d2 .tag{position:absolute;top:10px;padding:2px 12px;border-radius:999px;font-size:12px;font-weight:700;background:#000a;box-shadow:inset 0 0 0 1px var(--gold-lo)}
#d2 .me .tag{right:10px}#d2 .op .tag{left:10px}
#d2 .mid{position:absolute;left:380px;right:380px;top:24px;bottom:24px;display:flex;flex-direction:column;align-items:center;gap:16px}
#d2 .vs{font-size:64px;font-weight:800;margin-top:6px}
#d2 .car{display:flex;align-items:center;gap:10px}
#d2 .car .arena{width:300px;height:120px;filter:none;box-shadow:0 0 0 1px #000,0 0 0 2px var(--gold)}
#d2 .car .arena span{font-size:15px;padding:6px 0}
#d2 .grid{display:flex;gap:10px;margin-top:auto}
#d2 .sq{width:80px;height:80px;border-radius:8px;overflow:hidden;cursor:pointer;box-shadow:0 0 0 1px #000,0 0 0 2px #8d642899;filter:brightness(.7)}
#d2 .sq img{width:100%;height:100%;object-fit:cover;object-position:50% 15%}
#d2 .sq.on{box-shadow:0 0 0 1px #000,0 0 0 3px var(--gold-hi),0 0 16px var(--c);filter:none}
#d2 .cta{display:flex;gap:14px}

/* ---------- 3. Sidebar + coverflow ---------- */
#d3 .bar{position:absolute;right:0;top:0;bottom:0;width:300px;padding:28px 26px;display:flex;flex-direction:column;gap:14px;background:linear-gradient(270deg,#05070df5,#05070dd9);box-shadow:-1px 0 0 #8d642877}
#d3 .bar .logo{font-size:30px;font-weight:800;text-align:center}
#d3 .bar .btn{width:100%}
#d3 .bar h4{margin:8px 0 0;font-size:13px;color:var(--gold);font-weight:700}
#d3 .alist{display:flex;flex-direction:column;gap:8px}
#d3 .alist .arena{width:100%;height:46px}
#d3 .alist .arena span{inset:0;display:flex;align-items:center;justify-content:flex-start;padding:0 12px;font-size:13px;background:linear-gradient(270deg,#000c,#0000)}
#d3 .main{position:absolute;left:0;right:300px;top:0;bottom:0}
#d3 .flow{position:absolute;left:0;right:0;top:40px;height:440px;display:flex;align-items:center;justify-content:center;perspective:1200px}
#d3 .fc{position:absolute;width:260px;height:416px;cursor:pointer;transition:transform .35s,opacity .35s,filter .35s}
#d3 .fc img{width:100%;height:100%;box-shadow:0 0 0 1px #000,0 0 0 2px var(--gold-lo)}
#d3 .fc.c img{box-shadow:0 0 0 1px #000,0 0 0 2px var(--gold-hi),0 0 50px var(--c)}
#d3 .arr{position:absolute;top:240px;width:44px;height:44px;font-size:22px}
#d3 .info{position:absolute;left:0;right:0;bottom:30px;text-align:center}
#d3 .info b{display:block;font-size:40px;font-weight:800}
#d3 .info em{font-style:normal;color:var(--c);font-weight:600}
#d3 .info .btn{margin-top:6px}

/* ---------- 4. Fan ---------- */
#d4 .tl{position:absolute;right:40px;top:30px;width:520px}
#d4 .tl b{display:block;font-size:56px;font-weight:800}
#d4 .tl em{font-style:normal;color:var(--c);font-weight:600;font-size:16px}
#d4 .tl p{margin:8px 0 12px;color:var(--ink);opacity:.9;font-size:14px;line-height:1.8}
#d4 .tr{position:absolute;left:40px;top:30px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
#d4 .tr .row{display:flex;gap:8px}
#d4 .tr .arena{width:120px;height:58px}
#d4 .fan{position:absolute;left:0;right:0;bottom:-40px;height:330px;display:flex;justify-content:center;align-items:flex-end;direction:ltr}
#d4 .fn{width:170px;height:272px;margin:0 -18px;cursor:pointer;transform:rotate(var(--r)) translateY(var(--y));transition:transform .3s,filter .3s;filter:brightness(.7)}
#d4 .fn img{width:100%;height:100%;box-shadow:0 0 0 1px #000,0 0 0 2px var(--gold-lo),0 14px 30px #000c}
#d4 .fn.on{transform:rotate(0) translateY(-46px) scale(1.12);filter:none;z-index:5}
#d4 .fn.on img{box-shadow:0 0 0 1px #000,0 0 0 2px var(--gold-hi),0 0 40px var(--c)}
#d4 .cta{position:absolute;left:40px;bottom:30px;display:flex;flex-direction:column;gap:12px}
#d4 .icons{position:absolute;left:40px;top:250px;display:none}
</style>
</head>
<body>
<div class="top">
  <h1>أسرار الظلام · شاشة اختيار الساحر</h1>
  <button class="tab on" data-d="1">١ · المسرح</button>
  <button class="tab" data-d="2">٢ · وجهاً لوجه</button>
  <button class="tab" data-d="3">٣ · القائمة الجانبية</button>
  <button class="tab" data-d="4">٤ · المروحة</button>
</div>
<p class="note" id="note"></p>
<div class="stage"><div class="fit" id="fit">

  <!-- 1. Hero stage -->
  <section class="screen on" id="d1">
    <div class="hero" data-hero><img class="poster" data-img alt=""><div class="cap"><b class="gtxt" data-name></b><em data-elem></em><br><button class="btn dark sm"><span class="ic">auto_awesome</span> القصة والقدرات</button></div></div>
    <div class="side">
      <div class="head"><div style="display:flex;gap:10px"><button class="round"><span class="ic">settings</span></button><button class="round"><span class="ic">volume_up</span></button></div><div class="t gtxt">اختر ساحرك</div></div>
      <div class="meds" data-roster="med"></div>
      <div class="row"><span class="lbl">الساحة</span><div style="display:flex;gap:10px" data-arenas></div></div>
      <div class="row"><span class="lbl">مستوى الخصم</span><button class="chip">سهل</button><button class="chip on">متوسط</button><button class="chip">صعب</button></div>
      <div class="cta"><button class="btn"><span class="ic">swords</span> ابدأ المبارزة</button><button class="btn ice">تحدَّ صديقًا</button></div>
    </div>
  </section>

  <!-- 2. Face off -->
  <section class="screen" id="d2">
    <div class="p me" data-hero><img class="poster" data-img alt=""><span class="tag">أنت</span><div class="nm gtxt" data-name></div></div>
    <div class="p op"><div class="q">؟</div><span class="tag">خصم عشوائي</span><div class="nm" style="color:var(--muted)">؟؟؟</div></div>
    <div class="mid">
      <div class="car"><button class="round"><span class="ic">arrow_back</span></button><div class="arena" data-arena-one></div><button class="round" style="transform:scaleX(-1)"><span class="ic">arrow_back</span></button></div>
      <div style="display:flex;gap:8px"><button class="chip">سهل</button><button class="chip on">متوسط</button><button class="chip">صعب</button></div>
      <div class="vs gtxt">ضد</div>
      <div class="grid" data-roster="sq"></div>
      <div class="cta"><button class="btn"><span class="ic">swords</span> ابدأ</button><button class="btn ice">تحدَّ صديقًا</button></div>
    </div>
  </section>

  <!-- 3. Sidebar + coverflow -->
  <section class="screen" id="d3">
    <div class="bar">
      <div class="logo gtxt">أسرار الظلام</div>
      <button class="btn"><span class="ic">swords</span> ضد الحاسوب</button>
      <button class="btn ice">تحدَّ صديقًا</button>
      <h4>الساحة</h4><div class="alist" data-arenas></div>
      <h4>مستوى الخصم</h4><div style="display:flex;gap:6px"><button class="chip">سهل</button><button class="chip on">متوسط</button><button class="chip">صعب</button></div>
      <div style="margin-top:auto;display:flex;gap:10px;justify-content:center"><button class="round"><span class="ic">settings</span></button><button class="round"><span class="ic">volume_up</span></button><button class="round"><span class="ic">logout</span></button></div>
    </div>
    <div class="main">
      <div class="flow" data-flow></div>
      <button class="round arr" style="right:40px" data-next="1"><span class="ic">arrow_back</span></button>
      <button class="round arr" style="left:40px;transform:scaleX(-1)" data-next="-1"><span class="ic">arrow_back</span></button>
      <div class="info" data-hero><b class="gtxt" data-name></b><em data-elem></em><br><button class="btn dark sm"><span class="ic">auto_awesome</span> القصة والقدرات</button></div>
    </div>
  </section>

  <!-- 4. Fan -->
  <section class="screen" id="d4">
    <div class="tl" data-hero><b class="gtxt" data-name></b><em data-elem></em><p data-line></p><button class="btn dark sm"><span class="ic">auto_awesome</span> القصة والقدرات</button></div>
    <div class="tr"><div class="row" data-arenas></div><div class="row"><button class="chip">سهل</button><button class="chip on">متوسط</button><button class="chip">صعب</button></div></div>
    <div class="cta"><button class="btn"><span class="ic">swords</span> ابدأ المبارزة</button><button class="btn ice">تحدَّ صديقًا</button></div>
    <div class="fan" data-roster="fan"></div>
  </section>
</div></div>

<script>
const W = [
  { id: 'reem', name: 'ريم', elem: 'ساحرة النار', c: '#ffb347', line: 'ابنة حدّادٍ من قريةٍ جبلية، تعلّمت ترويض النار في فرن أبيها.' },
  { id: 'siraj', name: 'سراج', elem: 'ساحر الجليد', c: '#a9e4ff', line: 'أقدم حرّاس الأكاديمية، عاد من الجبل المتجمّد أبيض الشعر بارد القلب.' },
  { id: 'layla', name: 'ليلى', elem: 'ساحرة الظل', c: '#d49bff', line: 'لا يعرف أحدٌ من أين جاءت؛ يُقال إنها تعلّمت السحر من ظلّها.' },
  { id: 'qasem', name: 'قاسم', elem: 'ساحر البرق', c: '#fff3a0', line: 'فارسٌ أصابته صاعقة في معركة، فصار البرق يسري في عروقه.' },
  { id: 'ehab', name: 'إيهاب', elem: 'كبير السحرة', c: '#f0c46a', line: 'كبير السحرة وأقوى من حمل عصًا في تاريخ أكاديمية النيلوفر.' },
];
const AR = [['terrace', 'شرفة القلعة'], ['court', 'الساحة الحجرية'], ['palace', 'فناء القصر']];
const NOTES = {
  1: 'المسرح: الساحر المختار بصورة كبيرة عاليمين، والسحرة دوائر فوق، والساحات صور حقيقية بتختار منها، وأزرار البداية تحت.',
  2: 'وجهاً لوجه: متل ألعاب القتال الكلاسيكية. إنت عاليمين والخصم «؟» عاليسار، واختيار الساحة بأسهم بالنص، والسحرة مربعات تحت.',
  3: 'القائمة الجانبية: كل الأزرار والإعدادات بعمود عاليمين، والسحرة بعرض دوّار (تمرّق بالأسهم أو بتكبس عالصورة) بالمساحة الكبيرة.',
  4: 'المروحة: السحرة كمروحة بطاقات تحت، والمختار بيطلع لفوق ويكبر، واسمه وقصته القصيرة كبار فوق، والساحات والمستوى بالزاوية.',
};
let sel = 4, arena = 0;
const img = id => `../play/models/portraits/${id}.webp`;
function render() {
  const w = W[sel];
  document.querySelectorAll('[data-hero]').forEach(h => h.style.setProperty('--c', w.c));
  document.querySelectorAll('[data-img]').forEach(i => i.src = img(w.id));
  document.querySelectorAll('[data-name]').forEach(e => e.textContent = w.name);
  document.querySelectorAll('[data-elem]').forEach(e => e.textContent = w.elem);
  document.querySelectorAll('[data-line]').forEach(e => e.textContent = w.line);
  document.querySelectorAll('[data-roster]').forEach(box => {
    const kind = box.dataset.roster;
    box.innerHTML = '';
    W.forEach((x, i) => {
      const on = i === sel ? ' on' : '';
      const d = document.createElement('div'); d.style.setProperty('--c', x.c);
      if (kind === 'med') { d.className = 'med' + on; d.innerHTML = `<img src="${img(x.id)}" alt=""><span>${x.name}</span>`; }
      if (kind === 'sq') { d.className = 'sq' + on; d.innerHTML = `<img src="${img(x.id)}" alt="">`; }
      if (kind === 'fan') { const off = i - 2; d.className = 'fn' + on; d.style.setProperty('--r', off * 6 + 'deg'); d.style.setProperty('--y', Math.abs(off) * 16 + 'px'); d.innerHTML = `<img class="poster" src="${img(x.id)}" alt="">`; }
      d.onclick = () => { sel = i; render(); };
      box.append(d);
    });
  });
  // coverflow
  const flow = document.querySelector('[data-flow]'); flow.innerHTML = '';
  W.forEach((x, i) => {
    let off = i - sel; if (off > 2) off -= 5; if (off < -2) off += 5;
    const d = document.createElement('div'); d.className = 'fc' + (off === 0 ? ' c' : ''); d.style.setProperty('--c', x.c);
    d.style.transform = `translateX(${-off * 210}px) translateZ(${-Math.abs(off) * 160}px) rotateY(${off * 18}deg)`;
    d.style.zIndex = 10 - Math.abs(off); d.style.opacity = Math.abs(off) > 1 ? .45 : 1; d.style.filter = off ? 'brightness(.6)' : 'none';
    d.innerHTML = `<img class="poster" src="${img(x.id)}" alt="">`; d.onclick = () => { sel = i; render(); };
    flow.append(d);
  });
  document.querySelectorAll('[data-arenas]').forEach(box => {
    box.innerHTML = '';
    AR.forEach(([id, n], i) => { const a = document.createElement('div'); a.className = 'arena' + (i === arena ? ' on' : ''); a.innerHTML = `<img src="a_${id}.webp" alt=""><span>${n}</span>`; a.onclick = () => { arena = i; render(); }; box.append(a); });
  });
  const one = document.querySelector('[data-arena-one]'); one.innerHTML = `<img src="a_${AR[arena][0]}.webp" alt=""><span>${AR[arena][1]}</span>`;
}
document.querySelectorAll('[data-next]').forEach(b => b.onclick = () => { sel = (sel + +b.dataset.next + 5) % 5; render(); });
document.querySelectorAll('.car .round').forEach((b, k) => b.onclick = () => { arena = (arena + (k ? 1 : 2)) % 3; render(); });
function show(n) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.d == n));
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id == 'd' + n));
  document.getElementById('note').textContent = NOTES[n];
  history.replaceState(null, '', '#' + n);
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => show(t.dataset.d));
function fit() { const k = Math.min(1, (innerWidth - 24) / 1280); const f = document.getElementById('fit'); f.style.transform = `scale(${k})`; f.style.height = 640 * k + 'px'; }
addEventListener('resize', fit); fit(); render(); show(+(location.hash.slice(1)) || 1);
</script>
</body>
</html>
