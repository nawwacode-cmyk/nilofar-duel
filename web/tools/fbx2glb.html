<!doctype html><meta charset="utf-8"><title>fbx2glb (dev tool)</title>
<script type="module">
// Dev-only tool (served by `npx vite`, never built): FBX character → GLB with textures resized to ≤ MAX px.
import * as THREE from 'three';
import { FBXLoader } from 'three/examples/jsm/loaders/FBXLoader.js';
import { GLTFExporter } from 'three/examples/jsm/exporters/GLTFExporter.js';
window.fbx2glb = async (url, max = 1024) => {
  const obj = await new FBXLoader().loadAsync(url);
  obj.animations = [];
  // Embedded textures finish loading after the model: wait for every image first.
  const maps = []; obj.traverse(o => { if (o.isMesh) for (const m of [].concat(o.material)) if (m.map) maps.push(m.map); });
  await Promise.all(maps.map(t => t.image && !t.image.complete && t.image.decode ? t.image.decode().catch(() => {}) : null));
  for (let i = 0; i < 40 && maps.some(t => !t.image || !t.image.width); i++) await new Promise(r => setTimeout(r, 250));
  const seen = new Map();
  const shrink = t => {
    if (!t) return null; if (seen.has(t)) return seen.get(t);
    if (!t.image || !t.image.width) { seen.set(t, null); return null; }
    const im = t.image, k = Math.min(1, max / Math.max(im.width, im.height));
    const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(im.width * k)); c.height = Math.max(1, Math.round(im.height * k));
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    const n = new THREE.CanvasTexture(c); n.colorSpace = t.colorSpace; n.flipY = t.flipY; n.wrapS = t.wrapS; n.wrapT = t.wrapT; seen.set(t, n); return n;
  };
  obj.traverse(o => { if (!o.isMesh) return; const ms = Array.isArray(o.material) ? o.material : [o.material];
    const out = ms.map(m => new THREE.MeshStandardMaterial({ name: m.name, map: shrink(m.map), normalMap: null, color: m.map ? 0xffffff : (m.color ?? 0xffffff), roughness: 0.8, metalness: 0, transparent: !!m.transparent, alphaTest: m.alphaTest || 0, side: m.side }));
    o.material = Array.isArray(o.material) ? out : out[0]; });
  const glb = await new GLTFExporter().parseAsync(obj, { binary: true, onlyVisible: false });
  window.__glb = new Uint8Array(glb);
  let s = ''; for (let i = 0; i < __glb.length; i += 0x8000) s += String.fromCharCode(...__glb.subarray(i, i + 0x8000));
  window.__b64 = btoa(s);
  return __glb.length;
};
window.chunk = (i, n = 4 * 1024 * 1024) => __b64.slice(i * n, (i + 1) * n);
document.title = 'ready';
</script>
